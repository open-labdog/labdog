services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: labdog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labdog_test_pw}
      POSTGRES_DB: labdog
    volumes:
      # PG 18 stores data in a version-specific subdir; mount the parent
      # (/var/lib/postgresql), not .../data, or nothing persists.
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labdog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    # 8.x line carries the fix for CVE-2026-23479 (also patched in 7.4.9); the
    # tag tracks latest 8.x so future backports are picked up on pull.
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  labdog:
    container_name: labdog
    image: labdog:latest
    environment:
      LABDOG_DATABASE__URL: postgresql+asyncpg://labdog:${POSTGRES_PASSWORD:-labdog_test_pw}@postgres:5432/labdog
      LABDOG_REDIS__URL: redis://redis:6379/0
      LABDOG_SECURITY__SECRET_KEY: "${LABDOG_SECURITY__SECRET_KEY}"
      LABDOG_SECURITY__ENCRYPTION_KEY: "${LABDOG_SECURITY__ENCRYPTION_KEY}"
      LABDOG_SECURITY__LABDOG_SERVER_IP: ${LABDOG_SECURITY__LABDOG_SERVER_IP:-127.0.0.1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
