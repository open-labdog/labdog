# Example Prometheus scrape configuration for LabDog.
#
# LabDog's /metrics endpoint is DISABLED by default. Enable it first in
# /etc/labdog/labdog.toml (then restart LabDog):
#
#     [metrics]
#     enabled = true
#
# The endpoint is UNAUTHENTICATED when enabled. Restrict access at your
# reverse proxy -- see docs/security-hardening.md.
#
# Only the `scrape_configs` block below is LabDog-specific; the rest of this
# file is a minimal Prometheus config so it can be run as-is for a trial.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - labdog-alerts.yml

scrape_configs:
  - job_name: labdog
    # LabDog aggregates from PostgreSQL on each scrape and caches the result
    # for [metrics] cache_ttl_seconds (default 15s). Scraping faster than the
    # cache TTL costs nothing extra, but gains nothing either.
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "labdog.example.com:8000"
        labels:
          # Useful when you run more than one LabDog instance.
          instance_name: production

  # --- TLS behind a reverse proxy -------------------------------------------
  # - job_name: labdog
  #   scheme: https
  #   static_configs:
  #     - targets: ["labdog.example.com"]
  #   tls_config:
  #     # Only if the proxy uses a private CA:
  #     ca_file: /etc/prometheus/labdog-ca.pem

  # --- If you put basic auth on /metrics at the proxy ------------------------
  # - job_name: labdog
  #   scheme: https
  #   static_configs:
  #     - targets: ["labdog.example.com"]
  #   basic_auth:
  #     username: prometheus
  #     password_file: /etc/prometheus/labdog-password
