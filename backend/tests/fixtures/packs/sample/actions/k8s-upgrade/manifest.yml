key: k8s-upgrade
name: Upgrade Kubernetes cluster
description: Group-dispatched (supports_host false) destructive action.
icon: Network
playbook: playbook.yml
version: "1.0"
estimated_duration: "5–20 min per node"
destructive: true
supports_group: true
supports_host: false
parameters:
  - key: target_version
    label: Target Kubernetes version
    type: string
    required: true
  - key: skip_preflight
    label: Skip preflight checks
    type: bool
    default: false
  - key: drain_timeout
    label: Drain timeout (seconds)
    type: int
    default: 300
