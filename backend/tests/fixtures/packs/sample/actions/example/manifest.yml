key: example
name: Example / System Probe
description: Destructive action with its own verify playbook.
icon: FlaskConical
playbook: playbook.yml
version: "1.0"
estimated_duration: "< 1 min"
destructive: true
supports_host: true
supports_group: true
verify_playbook: verify.yml
verify_timeout_seconds: 60
parameters:
  - key: marker_dir
    label: Marker directory
    type: string
    default: /var/lib/labdog-example
  - key: fail_verify
    label: Intentionally fail verify
    type: bool
    default: false
