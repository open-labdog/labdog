[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labdog-backend"
dynamic = ["version"]
description = "FastAPI backend for LabDog - Ansible-based Linux firewall manager"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    # Pinned as direct deps to force the security-patched transitive versions:
    # starlette>=1.0.1 fixes CVE-2026-48710 "BadHost" host-header auth bypass
    # (LabDog uses path-based auth middleware); python-multipart>=0.0.30 fixes
    # CVE-2026-40347 (DoS) and CVE-2026-53537 (Content-Disposition smuggling).
    "starlette>=1.0.1",
    "python-multipart>=0.0.30",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "celery-redbeat>=2.0",
    "redis>=5.2",
    "ansible-runner>=2.4",
    "ansible-core>=2.18",
    # cryptography>=49 fixes CVE-2026-34073 (private-key leak) and
    # CVE-2026-39892 (buffer overflow).
    "cryptography>=49",
    "fastapi-users[sqlalchemy]>=15",
    "slowapi>=0.1.9",
    # gitpython>=3.1.54 clears the path-traversal / RCE / command-injection
    # / env-exfiltration advisories fixed across 3.1.49–3.1.54, incl. the
    # 3.1.53/3.1.54 batch GHSA-3rp5-jjmw-4wv2, GHSA-fjr4-x663-mwxc,
    # GHSA-6p8h-3wgx-97gf, GHSA-r9mr-m37c-5fr3 (flagged by pip-audit as HIGH).
    "gitpython>=3.1.54",
    # asyncssh>=2.23.1 clears CVE-2026-45309 (a server-role AuthorizedKeysFile
    # traversal; LabDog is a client, so not directly exposed, but kept current).
    "asyncssh>=2.23.1",
    "wsproto>=1.2",
    "croniter>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "bandit>=1.9",
    "testcontainers[postgres]>=4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: marks tests as integration tests (deselect with '-m not integration')"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
