  mdadm -D: operands
  mdadm --examine: operands
  mdadm -E: operands
  mdadm --query: operands
  mdadm -Q: operands
  mdadm --detail-platform: operands
  mdadm --version: exact
  mdadm -V: exact
  cryptsetup status: operands
  cryptsetup luksDump: operands
  cryptsetup isLuks: operands
  cryptsetup luksUUID: operands
  cryptsetup benchmark: any
  cryptsetup --version: exact

  # --- scheduling and security -------------------------------------------
  crontab -l: exact
  atq: any
  sestatus: any
  getenforce: any
  aa-status: any


options:
  # --- files and text ----------------------------------------------------
  mount: {flags: [-l, --show-labels], values: [-t, --types]}
  file:
    clusters: true
    flags: [-b, -c, -E, -h, -i, -k, -l, -L, -N, -n, -p, -r, -s, -S, -z, -Z, "-0"]
    values: [-e, -F, -f, -m, -P]
  sort:
    clusters: true
    flags: [-b, -d, -f, -g, -i, -M, -h, -n, -R, -r, -V, -c, -C, -m, -s, -u, -z, --check]
    values: [-k, -t, -S, -T, --key, --field-separator, --buffer-size, --temporary-directory, --sort, --batch-size, --parallel, --files0-from, --random-source]
  uniq:
    clusters: true
    flags: [-c, -d, -D, -i, -u, -z]
    values: [-f, -s, -w, --skip-fields, --skip-chars, --check-chars]
    optional: [--all-repeated, --group]
  tree:
    clusters: true
    values: [-L, -P, -I, -H, -T, --charset, --filelimit, --timefmt, --sort]

  # --- system state ------------------------------------------------------
  hostname:
    clusters: true
    flags: [-a, --alias, -A, --all-fqdns, -d, --domain, -f, --fqdn, --long, -i, --ip-address, -I, --all-ip-addresses, -s, --short, -y, --yp, --nis, -v, --verbose, -V, --version]
  date:
    clusters: true
    flags: [-u, --utc, --universal, -R, --rfc-email, --debug, --resolution]
    values: [-d, --date, -f, --file, -r, --reference, --rfc-3339]
    optional: [-I, --iso-8601]
  lastlog:
    clusters: true
    values: [-b, --before, -R, --root, -t, --time, -u, --user]
  dmidecode:
    flags: [-u, --dump, -q, --quiet, --no-sysfs]
    values: [-d, --dev-mem, -s, --string, -t, --type, -H, --handle, --from-dump, --oem-string]
  dmesg:
    clusters: true
    values: [-F, --file, -f, --facility, -l, --level, -s, --buffer-size, --time-format, --since, --until]
    optional: [-L, --color]
  sysctl:
    clusters: true
    values: [-r, --pattern]
  journalctl:
    values: [--cursor, --after-cursor]
  command: {flags: [-p]}

  # --- networking --------------------------------------------------------
  ip:
    flags: ["-4", "-6", -s, -stats, -statistics, -d, -details, -br, -brief, -j, -json, -p, -pretty, -o, -oneline, -c, -color, -r, -resolve]
  ifconfig: {flags: [-a, -s, -v]}
  ss:
    clusters: true
    values: [-f, --family, -A, --query, --socket, -D, --diag, -F, --filter, -N, --net]
  route:
    clusters: true
    flags: [-n, --numeric, -N, -e, --extend, -v, --verbose, -F, --fib, -C, --cache, "-4", "-6", --inet, --inet6]
    values: [-A]
  arp:
    clusters: true
    values: [-i, --device, -H, --hw-type, -A, -p, --protocol]
  curl:
    clusters: true
    flags: [-s, -S, -L, -f, -I, -i, -k, -v, "-4", "-6", -g, -N, -G, -q, "-#", "-0", -B, -j, -l, -n, -p, -R, -Z, -a, -M, -V,
            --head, --silent, --show-error, --location, --location-trusted, --fail, --fail-with-body, --include,
            --verbose, --insecure, --compressed, --globoff, --no-buffer, --get, --http1.0, --http1.1, --http2,
            --http3, --ipv4, --ipv6, --no-progress-meter, --path-as-is, --raw, --no-keepalive, --tcp-nodelay]
    values: [-E, -K, -C, -b, -c, -d, -D, -F, -P, -H, -m, -o, -U, -Q, -r, -e, -X, -Y, -y, -t, -z, -T, -u, -A, -w, -x,
             --cookie, --proxy, --url, --max-time, --connect-timeout, --write-out, --user-agent, --referer, --user,
             --resolve, --connect-to, --cacert, --capath, --cert, --key, --retry, --retry-delay, --retry-max-time,
             --max-redirs, --range, --interface, --unix-socket, --abstract-unix-socket, --noproxy, --proto,
             --proto-redir, --limit-rate, --dns-servers, --oauth2-bearer]
  resolvectl:
    clusters: true
    flags: ["-4", "-6", --no-pager]
    values: [-i, --interface, -p, --protocol, -t, --type, -c, --class, --json, --legend]
  nft:
    clusters: true
    flags: [-a, --handle, -j, --json, -n, --numeric, -s, --stateless, -t, --terse, -N, --reversedns, -S, --service, -T, --numeric-time, -u, --guid, -y, --numeric-priority, -p, --numeric-protocol]
  iptables: {clusters: true, values: [-t, --table]}
  ip6tables: {clusters: true, values: [-t, --table]}
  iptables-save: {clusters: true, values: [-t, --table]}
  ip6tables-save: {clusters: true, values: [-t, --table]}

  # --- packages ----------------------------------------------------------
  dpkg:
    flags: [--no-pager]
    values: [--admindir, --root, --verify-format]
  apt: {flags: [-q, -qq, --quiet]}
  apt-cache: {flags: [-q, -qq, --quiet]}
  rpm:
    flags: [--last, --nodigest, --nosignature, -v, --verbose, --quiet, -a, --all, -i, --info, -l, --list,
            -c, --configfiles, -d, --docfiles, -R, --requires, --provides, --changelog, --scripts,
            -f, --file, -p, --package, -g, --group, --whatprovides, --whatrequires, -s, --state, --dump,
            --filesbypkg, --conflicts, --obsoletes]
    values: [--qf, --queryformat]
  dnf:
    flags: [-q, --quiet, -C, --cacheonly, -v, --verbose]
    values: [--enablerepo, --disablerepo, --repo, --repoid, --releasever]
  yum:
    flags: [-q, --quiet, -C, --cacheonly, -v, --verbose]
    values: [--enablerepo, --disablerepo, --releasever]
  zypper:
    flags: [-q, --quiet, -n, --non-interactive, --no-refresh, -x, --xmlout, -t, --terse]
  flatpak: {flags: [--user, --system, -v, --verbose]}
  pip: {flags: [-q, --quiet, -v, --verbose, --disable-pip-version-check, --no-color, --isolated]}
  pip3: {flags: [-q, --quiet, -v, --verbose, --disable-pip-version-check, --no-color, --isolated]}
  npm:
    flags: [--json, -g, --global, -l, --long, -p, --parseable, -a, --all]
    values: [--depth, --omit, --include, -w, --workspace, --audit-level]
  needrestart: {clusters: true, flags: [-k, -l, -w, -v, -q, -n]}

  # --- services ----------------------------------------------------------
  systemctl:
    clusters: true
    flags: [--system, --user, --failed, -a, --all, -l, --full, -r, --recursive, --reverse,
            --with-dependencies, --show-types, --value, -q, --quiet, --no-warn, --no-pager,
            --no-legend, --no-ask-password, --plain]
    values: [-H, --host, -M, --machine, -t, --type, --state, -p, --property, -P, -n, --lines,
             -o, --output, --legend, --timestamp]
  loginctl:
    clusters: true
    flags: [--no-pager, --no-legend, -a, --all, -l, --full, --value, --no-ask-password]
    values: [-p, --property, -P, -H, --host, -M, --machine, -n, --lines, -o, --output]
  timedatectl:
    clusters: true
    flags: [--no-pager, --no-ask-password, -a, --all, --value, --monitor]
    values: [-H, --host, -M, --machine, -p, --property, -P]
  hostnamectl:
    flags: [--static, --transient, --pretty, --no-ask-password]
    values: [-H, --host, -M, --machine, --json]

  # --- containers --------------------------------------------------------
  docker:
    flags: [-D, --debug]
    values: [--config, -c, --context, -H, --host, -l, --log-level]
  docker compose:
    values: [-f, --file, -p, --project-name, --project-directory, --profile, --env-file, --ansi, --progress, --parallel]
  nerdctl:
    values: [-n, --namespace, -a, --address, -H, --host]
  nerdctl compose:
    values: [-f, --file, -p, --project-name, --project-directory, --profile, --env-file]
  crictl:
    values: [-r, --runtime-endpoint, -i, --image-endpoint, -t, --timeout, -c, --config]
  ctr:
    flags: [--debug]
    values: [-a, --address, -n, --namespace, --timeout, --connect-timeout]
  kubectl:
    clusters: true
    values: [-n, --namespace, --context, --kubeconfig, --cluster, --user, -s, --server, --request-timeout, -v, --v]
  kubeadm:
    values: [--kubeconfig, -v, --v]

  # --- virtualisation and storage ----------------------------------------
  virsh:
    flags: [-r, --readonly, -q, --quiet]
    values: [-c, --connect]
  zpool import:
    flags: [-D]
    values: [-d]
  btrfs:
    flags: [-q, --quiet, -v, --verbose]
    values: [--format]
  smartctl:
    clusters: true
    values: [-d, --device, -T, --tolerance, -b, --badsum, -r, --report, -n, --nocheck, -s, -o, -S, -l, --log,
             -v, --vendorattribute, -F, --firmwarebug, -P, --presets, -B, --drivedb, -t, --test, -g, --get, -f, --format]
  mdadm:
    clusters: true
    flags: [--scan, -s, --brief, -b, --verbose, -v, --export, -Y, --test, -t]
  cryptsetup: {flags: [-v, --verbose, --debug]}

  # --- scheduling --------------------------------------------------------
  crontab: {values: [-u]}


gates:
  # --- files and text ----------------------------------------------------
  find:
    - reason: find can delete files, run commands, or write a file with these actions
      words: [-delete, -exec, -execdir, -ok, -okdir, -fls, -fprint, -fprint0, -fprintf]
  file:
    - reason: file -C writes a compiled magic file
      short: C
      long: [compile]
  tree:
    - reason: tree -o writes its output to a file, and -R writes one into every directory
      short: oR
  sort:
    - reason: sort -o writes its output to a file, and --compress-program runs a program
      short: o
      long: [output, compress-program]
  uniq:
    - reason: uniq writes to its second file argument
      operands: 1
  jq:
    - reason: in-place editing rewrites the file
      short: i
      long: [in-place]
  yq:
    - reason: yq -i rewrites the file in place, and -s writes a file per document
      short: is
      long: [inplace, in-place, split-exp]

  # --- system state ------------------------------------------------------
  date:
    - reason: date -s, or a date given as digits, sets the system clock
      short: s
      long: [set]
    - reason: date -s, or a date given as digits, sets the system clock
      pattern: '(?:^|\s)[0-9]{8,}(?:\.[0-9]{2})?(?=\s|$)'
  lastlog:
    - reason: lastlog -C and -S change the login records
      short: CS
      long: [clear, set]
  dmidecode:
    - reason: dmidecode --dump-bin writes the table to a file
      long: [dump-bin]
  dmesg:
    - reason: these dmesg options clear the kernel log or change what reaches the console
      short: CcDEn
      long: [clear, read-clear, console-off, console-on, console-level]
  sysctl:
    - reason: sysctl -w, -p, --system or a key=value argument changes kernel settings
      short: wpf
      long: [write, load, system]
    - reason: sysctl -w, -p, --system or a key=value argument changes kernel settings
      pattern: '(?:^|\s)[^\s=-][^\s=]*='
  journalctl:
    - reason: these journalctl options delete, rotate, move or re-key the journal, or write a file
      long: [vacuum-size, vacuum-time, vacuum-files, rotate, flush, relinquish-var, smart-relinquish-var,
             sync, setup-keys, update-catalog, cursor-file]
  sar:
    - reason: sar -o writes the samples to a file
      short: o
  debsums:
    - reason: debsums -g writes checksum files
      short: g
      long: [generate]

  # --- networking --------------------------------------------------------
  ifconfig:
    - reason: ifconfig with more than an interface name changes that interface
      operands: 1
  ss:
    - reason: ss -K closes sockets, and -D writes to a file
      short: KD
      long: [kill, diag]
  arp:
    - reason: arp -s, -d and -f change the ARP table
      short: sdfD
      long: [set, delete, file, use-device]
  curl:
    - reason: curl -o writes the response to a file
      short: o
      long: [output]
      unless_value: /dev/null
    - reason: curl writes the response to a file named after the URL
      short: OJ
      long: [remote-name, remote-name-all, remote-header-name, output-dir, create-dirs]
    - reason: curl sends data, which makes the request a POST or an upload
      short: dFT
      long: [data, data-ascii, data-binary, data-raw, data-urlencode, json, form, form-string, form-escape,
             upload-file, url-query]
    - reason: a request method other than GET or HEAD can change what it is sent to
      short: X
      long: [request]
      unless_value: '(?i)GET|HEAD'
    - reason: curl -K reads further options from a file
      short: K
      long: [config]
    - reason: curl writes cookies, traces or caches to a file
      short: c
      long: [cookie-jar, trace, trace-ascii, libcurl, etag-save, hsts, alt-svc]
    - reason: curl writes the headers or its errors to a file
      short: D
      long: [dump-header, stderr]
      unless_value: '-|/dev/null'
    - reason: a header given as @file sends that file's contents
      short: H
      long: [header, proxy-header]
      if_value: '@.*'
    - reason: curl -Q sends FTP or SFTP commands
      short: Q
      long: [quote]
    - reason: curl variables and engines read files and load code
      long: [variable, engine]
    - reason: gopher, dict and telnet URLs send raw bytes to the service, which can be commands
      pattern: '(?i)(?:^|[\s"''=])(?:gopher|dict|telnet)s?://'
  openssl:
    - reason: this option writes a file or loads code into openssl
      words: [-out, -keyout, -writerand, -keylogfile, -sess_out, -reqout, -respout, -msgfile,
              -CAcreateserial, -CAserial, -engine, -provider, -provider-path]
  nft:
    - reason: nft reads a ; or a newline in its arguments as the start of another command
      pattern: '[;\n]'
  iptables: &iptables
    - reason: this iptables command changes the rules
      short: ADIRFZNXPE
      long: [append, delete, insert, replace, flush, zero, new-chain, delete-chain, policy, rename-chain, modprobe]
  ip6tables: *iptables
  iptables-save: &iptables_save
    - reason: iptables-save -f writes a file, and -M runs a program
      short: fM
      long: [file, modprobe]
  ip6tables-save: *iptables_save

  # --- packages ----------------------------------------------------------
  rpm:
    - reason: "rpm runs what is inside %( ) and %{lua: } when it expands them"
      pattern: '%\(|%\{\s*lua'
  dnf: &dnf
    - reason: --setopt and --config can load plugins from anywhere
      short: c
      long: [setopt, config]
  yum: *dnf
  pacman -Ss: &pacman_sync
    - reason: these pacman options refresh the databases, upgrade or download
      short: yuw
      long: [refresh, sysupgrade, downloadonly]
  pacman -Ssq: *pacman_sync
  pacman -Si: *pacman_sync
  pacman -Sii: *pacman_sync
  pacman -Sl: *pacman_sync
  pacman -Slq: *pacman_sync
  pacman -Sg: *pacman_sync
  pacman -Sgg: *pacman_sync

  # --- containers --------------------------------------------------------
  docker compose config: &compose_config
    - reason: compose config -o writes the resolved file
      short: o
      long: [output]
  nerdctl compose config: *compose_config

  # --- storage -----------------------------------------------------------
  zpool events:
    - reason: zpool events -c clears the event log
      short: c
  btrfs device stats: &btrfs_stats
    - reason: btrfs device stats -z resets the counters
      short: z
      long: [reset]
  btrfs dev stats: *btrfs_stats
  smartctl:
    - reason: these smartctl options start or abort a self-test or change the drive's settings
      short: tXsoS
      long: [test, abort, smart, offlineauto, saveauto, set]
    - reason: smartctl -l scterc with values sets the drive's error recovery timeout
      short: l
      long: [log]
      if_value: '(?i)scterc,.*'


wrappers:
  sudo:
    clusters: true
    assignments: true
    flags: [-n, --non-interactive, -E, -H, --set-home, -i, --login, -s, --shell, -P, --preserve-groups,
            -S, --stdin, -k, --reset-timestamp, -A, --askpass, -B, --bell, -b, --background]
    values: [-u, --user, -g, --group, -p, --prompt, -C, --close-from, -h, --host, -r, --role, -t, --type,
             -T, --command-timeout, -U, --other-user, -D, --chdir, -R, --chroot]
    optional: [--preserve-env]
  doas:
    flags: [-n]
    values: [-u]
  env:
    clusters: true
    assignments: true
    flags: [-i, --ignore-environment, "-0", --null, -v, --debug]
    values: [-u, --unset, -C, --chdir]
  timeout:
    flags: [--preserve-status, --foreground, -v, --verbose]
    values: [-s, --signal, -k, --kill-after]
    operands: 1
  nice: {values: [-n, --adjustment]}
  ionice: {flags: [-t, --ignore], values: [-c, --class, -n, --classdata]}
  stdbuf: {values: [-i, --input, -o, --output, -e, --error]}
  nohup: {}
  setsid: {clusters: true, flags: [-c, --ctty, -f, --fork, -w, --wait]}
  time: {flags: [-p, --portability, -v, --verbose, -q, --quiet], values: [-f, --format]}


environment:
  - LANG
  - LANGUAGE
  - LC_*
  - TZ
  - COLUMNS
  - LINES
  - NO_COLOR
  - TERM
  - SYSTEMD_COLORS
  - KUBECONFIG
