# Which commands an AI session may run without anyone approving them.
#
# LabDog parses every command an AI session issues (app/ai/safety.py) and
# looks it up here. A command this file calls read-only runs in a read-only
# session and needs no approval in an approval session. Anything else is
# treated as a change: refused at read-only, held for approval at approval.
# The denylist in safety.py (rm -rf /, mkfs, piping a download into a
# shell, ...) applies on top of this and outranks it.
#
# The rule that shapes everything below: a command is read-only only if
# this file says so for the form it was given in. Not "docker, except the
# subcommands known to write" -- "docker ps, docker logs, docker inspect,
# ...". A subcommand, an option before the subcommand, or an argument this
# file does not know makes the command a change. Being wrong in that
# direction costs an approval prompt; being wrong the other way costs a
# broken host.
#
#
# read_only -- a command, or a command and its subcommand words, and what
# may follow them:
#
#   any        anything, subject to the gates below      kubectl get: any
#   operands   plain words (names, paths, patterns) and   dpkg -l: operands
#              the options declared for the command
#   exact      nothing but the declared options          kubectl cluster-info: exact
#
# A word that is * matches any one plain word (`service * status`). A word
# ending in * matches any word that starts with the rest (`pacman -Q*`).
# A command whose path is not listed is not read-only, so `docker` on its
# own, `docker rm` and `kubectl config use-context` all need approval.
#
# options -- what may come between the words of a read_only path, and how
# to read it. Declared on a command, they apply to its subcommands too.
#
#   flags      options that take no value                --no-pager
#   values     options that take one, as `-n x`, `-nx`   --namespace
#              or `--namespace=x`
#   optional   options whose value, if any, is attached  --color=auto
#   clusters   whether short options combine: -tlnp
#
# An option that is not declared, before the subcommand or anywhere in an
# `operands` or `exact` command, makes the command a change. Declaring a
# flag as taking a value, or a value option as a flag, would make LabDog
# read a different subcommand from the one the tool runs, so every entry
# here was checked against the tool's own --help.
#
# gates -- arguments that make an otherwise read-only command a change.
# Each gate fires on any of:
#
#   short      a letter in a cluster of short options     sort -o, curl -sLo
#   long       a long option, or any abbreviation of it   --output, --out
#              (GNU tools and curl accept abbreviations)
#   words      a word exactly                             find -delete
#   operands   more plain words than this                 uniq IN OUT
#   pattern    a regular expression over the arguments
#
# and is narrowed by if_value (fires only when the option's value fully
# matches) or unless_value (does not fire when it does). A gate on a
# command applies to its subcommands too. A long option a gate names is not
# matched by the exact name of a different, declared option: --cursor is
# journalctl's own option, not an abbreviation of --cursor-file.
#
# wrappers -- commands that run the rest of the line: sudo, env, timeout.
# The command they run is what gets classified. Their options are declared
# like a command's, and an undeclared one makes the line a change: `sudo -p
# cat rm x` runs rm, with "cat" as the password prompt.
#
# environment -- the variables a command may be given (`LC_ALL=C sort`,
# `env TZ=UTC date`). Any other assignment makes the command a change:
# LD_PRELOAD, PATH, BASH_ENV, LESSOPEN and friends change what runs.

