# gitleaks config for LabDog
#
# Extends the default ruleset (so new leaks still get caught) and adds
# narrow allowlist entries for known-fixture / known-historical
# false positives.
#
# Add a fingerprint here ONLY after verifying the value is not a
# real production secret. Fingerprint format:
# `<commit>:<path>:<rule>:<line>` — stable for a given commit.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, dev compose values, and documented placeholders"

paths = [
    '''^backend/tests/''',
    '''^frontend/e2e/''',
    '''^labdog\.toml$''',
    # Historical-only path. The plans/ directory no longer exists in
    # the working tree, but a historical commit contains a multi-agent
    # plan doc whose Section 6 step-8 inlined fake-PEM
    # markers ("-----BEGIN/END OPENSSH PRIVATE KEY-----" wrapping
    # the literal word "fake") to document what to mock in a unit
    # test. gitleaks scans recent commit history, so this allowlist
    # entry suppresses the historical false-positive without
    # masking real findings in the current tree.
    '''^plans/option-c-coalesced-per-host-sync\.md$''',
]

stopwords = []

# Commits verified to contain only non-production placeholder values.
# Gitleaks skips these SHAs entirely.
# NOTE: these are commit SHAs, so they change if history is ever
# rewritten again. Re-run gitleaks and update them if that happens.
commits = [
    # docker-compose.yml used BARRICADE_SECURITY__* placeholder keys —
    # superseded by LABDOG_* env vars in dev/labdog.toml; never production.
    # (Was 37d3ca56a03e61f6 before the 2026-08 history rewrite.)
    "d1e740b9a680c2ab070ca290336e3d1915ed606d",
]

regexes = [
    # CI test encryption key — string and its base64 form. Decodes to
    # literal "ci-test-encryption-key-32bytes".
    '''ci-test-encryption-key-32bytes''',
    '''Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVz''',
    # Conftest test key (asserted in tests/conftest.py).
    '''vrPDeLMuFGehy2sYV//fyTd7EmnvOKbE2n4h7XM/8zg=''',
    # Test secret key string used by CI + tests.
    '''(ci-)?test-secret-key-not-for-production''',
    # Old Barricade-era dev compose values, never used in production
    # and superseded by the rebranded LABDOG_* env vars in dev/labdog.toml.
    '''BARRICADE_SECURITY__SECRET_KEY''',
    '''BARRICADE_SECURITY__ENCRYPTION_KEY''',
    # app/ai/redaction.py replaces PEM private keys with a placeholder. An
    # early revision rebuilt an empty PEM envelope around it, so the
    # BEGIN-PRIVATE-KEY marker appears in that commit's diff and gitleaks
    # (which scans full history) flags it forever. The current code emits
    # only the placeholder, but the historical commit cannot be un-written
    # without a force-push. Matching on the placeholder token is safe by
    # construction: it is the string that *replaces* a secret, so anything
    # containing it is redacted output, never a credential.
    '''\{PLACEHOLDER\}''',
    '''redacted by labdog''',
]
