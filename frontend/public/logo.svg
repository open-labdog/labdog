  <g transform="translate(4 2)">
    <path d="M8 13H44" fill="none" stroke="#f5e9d4" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 13V40A12 12 0 0 1 20 40V29" fill="none" stroke="#d98f3f" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M20 21.5L14 30H26Z" fill="#d98f3f" stroke="#d98f3f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="20" cy="13" r="6.5" fill="#d98f3f" stroke="#1f2f3e" stroke-width="2.5"/>
    <circle cx="44" cy="13" r="4.6" fill="#f5e9d4" stroke="#1f2f3e" stroke-width="2.5"/>
  </g>
</svg>
