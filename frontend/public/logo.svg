<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 64 64" role="img" aria-label="unbork">
  <!-- A timeline with a restore point, and a U that turns back to it.
       Lines are the heavier small-size weights: this file is shown at
       22 to 40 px. app/icon.tsx draws the same mark for the favicon. -->
